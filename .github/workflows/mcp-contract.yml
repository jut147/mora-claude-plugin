name: MCP contract

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check repository formatting
        run: git diff --check --exit-code
      - name: Check connector script syntax
        run: node --check scripts/check-mora-mcp-contract.mjs
      - name: Check the live Mora MCP contract
        run: node scripts/check-mora-mcp-contract.mjs
